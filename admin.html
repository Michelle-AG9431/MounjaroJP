                    setStatus('Initialization Complete!');
                } catch (err) {
                    setStatus('Error: ' + err.message);
                }
            };

            return React.createElement("div", {className: "max-w-4xl mx-auto p-6"},
                React.createElement("div", {className: "flex justify-between items-center mb-8"},
                    React.createElement("h1", {className: "text-2xl font-bold"}, "Clinic Admin Panel"),
                    React.createElement("div", {className: "space-x-2"},
                        React.createElement("button", {onClick: handleNew, className: "bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"}, "+ Add New"),
                        clinics.length === 0 && React.createElement("button", {onClick: handleInitialize, className: "bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"}, "Initialize Data")
                    )
                ),
                
                status && React.createElement("div", {className: `p-4 mb-4 rounded ${status.includes('Error') ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}, status),

                // Editor
                selectedClinic ? React.createElement("div", {className: "bg-white p-6 rounded shadow-lg border border-gray-200"},
                    React.createElement("h2", {className: "text-xl font-bold mb-4"}, selectedClinic.id === 'new' ? 'New Clinic' : `Editing: ${selectedClinic.name?.en || selectedClinic.id}`),
                    React.createElement("div", {className: "mb-2 text-sm text-gray-500"}, "Edit the JSON directly. Ensure valid JSON syntax."),
                    React.createElement("textarea", {
                        className: "w-full h-96 p-4 font-mono text-sm border rounded bg-gray-50",
                        value: editJson,
                        onChange: (e) => setEditJson(e.target.value)
                    }),
                    React.createElement("div", {className: "flex justify-end gap-3 mt-4"},
                        React.createElement("button", {onClick: () => setSelectedClinic(null), className: "px-4 py-2 text-gray-600 hover:bg-gray-100 rounded"}, "Cancel"),
                        React.createElement("button", {onClick: handleSave, className: "px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"}, "Save Changes")
                    )
                ) : (
                    // List
                    React.createElement("div", {className: "bg-white rounded shadow overflow-hidden"},
                        clinics.length === 0 ? React.createElement("div", {className: "p-8 text-center text-gray-500"}, "No clinics found. Click 'Initialize Data' to start.") : 
                        React.createElement("table", {className: "w-full"},
                            React.createElement("thead", {className: "bg-gray-50"},
                                React.createElement("tr", null,
                                    React.createElement("th", {className: "px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"}, "ID"),
                                    React.createElement("th", {className: "px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"}, "Name (ZH)"),
                                    React.createElement("th", {className: "px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"}, "Actions")
                                )
                            ),
                            React.createElement("tbody", {className: "divide-y divide-gray-200"},
                                clinics.map(c => 
                                    React.createElement("tr", {key: c.id, className: "hover:bg-gray-50"},
                                        React.createElement("td", {className: "px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"}, c.id),
                                        React.createElement("td", {className: "px-6 py-4 whitespace-nowrap text-sm text-gray-500"}, c.name?.zh),
                                        React.createElement("td", {className: "px-6 py-4 whitespace-nowrap text-right text-sm font-medium"},
                                            React.createElement("button", {onClick: () => handleSelect(c), className: "text-blue-600 hover:text-blue-900 mr-4"}, "Edit"),
                                            React.createElement("button", {onClick: () => handleDelete(c.id), className: "text-red-600 hover:text-red-900"}, "Delete")
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(ClinicAdmin));
    </script>
</body>
</html>
