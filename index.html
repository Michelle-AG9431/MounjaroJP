    <style>
        body {
            background-color: #FAFAF9;
            color: #1C1917;
            -webkit-font-smoothing: antialiased;
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .rank-badge {
            transition: all 0.3s ease;
        }
        .group:hover .rank-badge {
            transform: scale(1.1);
        }
        
        /* Language Button Styles */
        .lang-btn {
            position: relative;
            padding-bottom: 4px;
            font-family: "Cormorant Garamond", "Noto Serif TC", serif;
            font-weight: 500;
            letter-spacing: 0.05em;
            font-size: 0.9rem;
            color: #A8A29E; /* stone-400 */
            transition: all 0.3s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            color: #1C1917; /* stone-900 */
        }
        .lang-btn.active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: #D4AF37; /* gold */
        }

        /* Custom Select Styles */
        .custom-select-wrapper {
            position: relative;
        }
        .custom-select-wrapper::after {
            content: "↓";
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #A8A29E;
            pointer-events: none;
            font-family: sans-serif;
        }
        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            background-color: #FFFFFF;
            border: 1px solid #E7E5E4;
            padding: 10px 32px 10px 16px;
            border-radius: 8px;
            font-family: "Noto Serif TC", serif;
            color: #1C1917;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .custom-select:hover {
            border-color: #D4AF37;
        }
        .custom-select:focus {
            outline: none;
            border-color: #D4AF37;
            ring: 1px solid #D4AF37;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>

                }

                return shippingCost;
            };

            const filterPricesByUserType = (prices) => {
                if (!prices) return [];
                if (userType === 'returning') {
                    // Returning users cannot see initial prices
                    return prices.filter(p => p.type !== 'initial');
                } else {
                    // New users logic...
                    const initialMonths = prices.filter(p => p.type === 'initial').map(p => p.months);
                    return prices.filter(p => {
                        if (p.type === 'initial') return true;
                        if (initialMonths.includes(p.months)) return false; 
                        return true;
                    });
                }
            };

            // Logic Helpers
            const getPriceForDosageMonths = (clinic, dosage, targetMonths) => {
                let prices = clinic.prices[dosage];
                if (!prices) return null;
                
                prices = filterPricesByUserType(prices);
                if (prices.length === 0) return null;

                const exactMatch = prices.find(p => p.months === targetMonths);
                if (exactMatch) return exactMatch.price;
                
                // Fallbacks...
                if (targetMonths === 2) {
                    const p2 = prices.find(p => p.months === 2);
                    if (p2) return p2.price;
                    const p1 = prices.find(p => p.months === 1);
                    if (p1) return p1.price * 2;
                }
                
                if (targetMonths === 1) {
                    const p1 = prices.find(p => p.months === 1);
                    if (p1) return p1.price;
                }

                const p1 = prices.find(p => p.months === 1);
                if (p1) return p1.price * targetMonths;

                return null;
            };

            const getSmartPrices = (clinic, dosage, targetDuration) => {
                let prices = clinic.prices[dosage];
                if (!prices) return [];
                
                prices = filterPricesByUserType(prices);
                if (prices.length === 0) return [];

                // Function to calc total with dynamic shipping and discounts
                const calculateTotal = (drugPrice, duration) => {
                    // Calculate basic offline status
                    const isOffline = region !== 'all' && clinic.locations && clinic.locations.includes(region);
                    
                    let total = drugPrice + getRegFee(clinic) + getShippingFee(clinic, region, duration);
                    
                    // Apply offline discount if applicable
                    if (isOffline && clinic.offlineDiscount) {
                        total -= clinic.offlineDiscount;
                    }
                    
                    // Apply online fee if applicable (e.g. TK Every)
                    // If region is 'all', treat as online (add fee)
                    // If region is specific and NOT offline, treat as online (add fee)
                    if ((region === 'all' || !isOffline) && clinic.onlineFee) {
                        total += clinic.onlineFee;
                    }
                    
                    return total;
                };

                // Check if it's ANY combo dosage (contains '+')
                if (dosage.includes('+')) {
                    const formatData = (p) => ({
                        ...p,
                        label: getLabel(p.months),
                        totalPrice: calculateTotal(p.price, p.months),
                        drugPriceOnly: p.price,
                        isCalculated: false,
                        calculationNote: t.calcNotes.mixed
                    });

                    if (targetDuration === 'all') {
                        // Apply Min Month Constraint Logic for All
                        if (clinic.minTotalMonths) {
                             const minMonths = clinic.minTotalMonths;
                             
                             const oneMonthCombo = prices.find(p => p.months === 1);
                             if (oneMonthCombo) {
                                 const items = [];
                                 // Min Package
                                 items.push({
                                     ...oneMonthCombo,
                                     months: minMonths,
                                     price: oneMonthCombo.price * minMonths,
                                     label: `${minMonths} ${t.months} (Min)`,
                                     totalPrice: calculateTotal(oneMonthCombo.price * minMonths, minMonths),
                                     drugPriceOnly: oneMonthCombo.price * minMonths,
                                     isCalculated: true,
                                     calculationNote: `Minimum ${minMonths} months required`
                                 });
                                 // 6 Months
                                 items.push({
                                     ...oneMonthCombo,
                                     months: 6,
                                     price: oneMonthCombo.price * 6,
                                     label: `6 ${t.months}`,
                                     totalPrice: calculateTotal(oneMonthCombo.price * 6, 6),
                                     drugPriceOnly: oneMonthCombo.price * 6,
                                     isCalculated: true,
                                     calculationNote: t.calcNotes.base1x6
                                 });
                                 return items;
                             }
                             return [];
                        }
                        return prices.map(formatData);
                    }
                    
                    const exactMatch = prices.find(p => p.months === targetDuration);
                    if (exactMatch) {
                         if (clinic.minTotalMonths && targetDuration < clinic.minTotalMonths) return [];
                         return [formatData(exactMatch)];
                    }
                    
                    return []; 
                }

                const formatData = (p) => ({
                    ...p,
                    label: getLabel(p.months),
                    totalPrice: calculateTotal(p.price, p.months),
                    drugPriceOnly: p.price,
                    isCalculated: false
                });

                if (targetDuration === 'all') {
                    // Logic to handle Min Total Months for 'All' view
                    if (clinic.minTotalMonths) {
                        const oneMonth = prices.find(p => p.months === 1);
                        if (oneMonth) {
                             const minMonths = clinic.minTotalMonths;
                             const items = [];
                             
                             // Synthesize Min Month Entry
                             items.push({
                                 ...oneMonth,
                                 months: minMonths,
                                 price: oneMonth.price * minMonths,
                                 label: `${minMonths} ${t.months} (Min Order)`,
                                 totalPrice: calculateTotal(oneMonth.price * minMonths, minMonths),
                                 drugPriceOnly: oneMonth.price * minMonths,
                                 isCalculated: true,
                                 calculationNote: `Minimum ${minMonths} months required`
                             });

                             // Synthesize 6 Month Entry (Standard comparison point)
                             items.push({
                                 ...oneMonth,
                                 months: 6,
                                 price: oneMonth.price * 6,
                                 label: `6 ${t.months}`,
                                 totalPrice: calculateTotal(oneMonth.price * 6, 6),
                                 drugPriceOnly: oneMonth.price * 6,
                                 isCalculated: true,
                                 calculationNote: t.calcNotes.base1x6
                             });
                             return items;
                        }
                        // If no 1 month price found, falls through (unlikely for this clinic)
                    }
                    return prices.map(formatData);
                }

                const exactMatch = prices.find(p => p.months === targetDuration);
                if (exactMatch) {
                    if (clinic.minTotalMonths && targetDuration < clinic.minTotalMonths) return [];
                    return [formatData(exactMatch)];
                }

                // Calculation logic for estimated months
                let calculatedDrugPrice = null;
                let calcNoteKey = '';

                if (targetDuration === 6) {
                    const price3mo = prices.find(p => p.months === 3);
                    const price2mo = prices.find(p => p.months === 2);
                    const price1mo = prices.find(p => p.months === 1);
                    if (price3mo) { calculatedDrugPrice = price3mo.price * 2; calcNoteKey = 'base3x2'; }
                    else if (price2mo) { calculatedDrugPrice = price2mo.price * 3; calcNoteKey = 'base2x3'; }
                    else if (price1mo) { calculatedDrugPrice = price1mo.price * 6; calcNoteKey = 'base1x6'; }
                } else if (targetDuration === 3) {
                    const price1mo = prices.find(p => p.months === 1);
                    if (price1mo) { calculatedDrugPrice = price1mo.price * 3; calcNoteKey = 'base1x3'; }
                } else if (targetDuration === 2) {
                    const price1mo = prices.find(p => p.months === 1);
                    if (price1mo) { calculatedDrugPrice = price1mo.price * 2; calcNoteKey = 'base1x2'; }
                }

                if (calculatedDrugPrice !== null) {
                    // Check Min Month Constraint for calculated prices
                    if (clinic.minTotalMonths && targetDuration < clinic.minTotalMonths) return [];

                    return [{
                        label: `${targetDuration} ${t.months} (${t.est})`,
                        price: calculatedDrugPrice,
                        totalPrice: calculateTotal(calculatedDrugPrice, targetDuration),
                        drugPriceOnly: calculatedDrugPrice,
                        months: targetDuration,
                        isCalculated: true,
                        calculationNote: t.calcNotes[calcNoteKey]
                    }];
                }
                return [];
            };

            const getBestPrice = (dosage, duration) => {
                let best = Infinity;
                clinics.forEach(clinic => {
                    const displayPrices = getSmartPrices(clinic, dosage, duration);
                    displayPrices.forEach(item => {
                        if (duration === 'all') {
                            const monthlyAvg = item.totalPrice / item.months;
                            if (monthlyAvg < best) best = monthlyAvg;
                        } else {
                            if (item.totalPrice < best) best = item.totalPrice;
                        }
                    });
                });
                return best;
            };

            const bestPrice = getBestPrice(activeDosage, activeDuration);

            const getClinicSortValue = (clinic) => {
                const displayPrices = getSmartPrices(clinic, activeDosage, activeDuration);
                if (displayPrices.length === 0) return Infinity; 
                let bestMetricForClinic = Infinity;
                displayPrices.forEach(item => {
                    const metric = activeDuration === 'all' ? (item.totalPrice / item.months) : item.totalPrice;
                    if (metric < bestMetricForClinic) bestMetricForClinic = metric;
                });
                return bestMetricForClinic;
            };

            // Chinese Filter Logic
            const filteredClinics = clinics.filter(c => {
                // Chinese Filter
                if (chineseFilter && !c.tags.some(tag => tag.en === 'Chinese Support')) {
                    return false;
                }

                // Region Filter for Offline-Only Clinics
                if (c.offlineOnly && region !== 'all') {
                    if (!c.locations || !c.locations.includes(region)) {
                        return false;
                    }
                }

                return true;
            });

            const sortedClinics = filteredClinics
                .filter(c => getSmartPrices(c, activeDosage, activeDuration).length > 0)
                .sort((a, b) => getClinicSortValue(a) - getClinicSortValue(b));

            const totalSelectedMonths = Object.values(cart).reduce((sum, val) => sum + val, 0);

            // New Helper: Calculate cheapest combination for target months using DP
            const calculateOptimalCombination = (clinic, dosage, targetMonths) => {
                let plans = clinic.prices[dosage];
                if (!plans) return null;
                
                // IMPORTANT: Filter plans by user type for the calculator too!
                plans = filterPricesByUserType(plans);
                if (plans.length === 0) return null;

                // Max months is 6. Working in 0.5 steps to support trial plans.
                // targetMonths is integer from input, but let's be safe.
                const maxUnits = Math.round(targetMonths * 2);
                const dp = new Array(maxUnits + 1).fill(null);
                
                // Base case: 0 cost for 0 months
                dp[0] = { cost: 0, plans: [] };

                for (let i = 1; i <= maxUnits; i++) {
                    for (let plan of plans) {
                        const planUnits = Math.round(plan.months * 2);
                        if (planUnits <= i) {
                            const remainder = i - planUnits;
                            if (dp[remainder]) {
                                const newCost = dp[remainder].cost + plan.price;
                                if (!dp[i] || newCost < dp[i].cost) {
                                    dp[i] = {
                                        cost: newCost,
                                        plans: [...dp[remainder].plans, plan]
                                    };
                                }
                            }
                        }
                    }
                }

                return dp[maxUnits];
            };

            const getCalculatorResults = () => {
                const results = [];
                const hasItems = totalSelectedMonths > 0;
                if (!hasItems) return [];

                // Filter clinics first
                const targetClinics = clinics.filter(c => {
                    // Chinese Filter
                    if (chineseFilter && !c.tags.some(tag => tag.en === 'Chinese Support')) {
                        return false;
                    }

                    // Region Filter for Offline-Only Clinics
                    if (c.offlineOnly && region !== 'all') {
                        if (!c.locations || !c.locations.includes(region)) {
                            return false;
                        }
                    }
                    
                    return true;
                });

                targetClinics.forEach(clinic => {
                    // Min Total Months Check for Calculator
                    if (clinic.minTotalMonths && totalSelectedMonths < clinic.minTotalMonths) {
                        return; // Skip this clinic
                    }

                    let totalMeds = 0;
                    let possible = true;
                    let breakdown = [];
                    let bundleApplied = false;

                    let tempCart = {...cart};
                    
                    const COMBO_KEYS = [
                        ['2.5mg', '5mg', '2.5mg+5mg', t.combo2550],
                        ['5mg', '7.5mg', '5mg+7.5mg', t.combo5075],
                        ['7.5mg', '10mg', '7.5mg+10mg', t.combo75100],
                        ['10mg', '12.5mg', '10mg+12.5mg', t.combo100125],
                        ['12.5mg', '15mg', '12.5mg+15mg', t.combo125150]
                    ];

                    COMBO_KEYS.forEach(([doseA, doseB, comboKey, label]) => {
                        if (tempCart[doseA] >= 1 && tempCart[doseB] >= 1) {
                            let comboData = clinic.prices[comboKey];
                            if (comboData) {
                                comboData = filterPricesByUserType(comboData); 
                                const twoMonthCombo = comboData.find(p => p.months === 2);
                                
                                if (twoMonthCombo) {
                                    const pairs = Math.min(tempCart[doseA], tempCart[doseB]);
                                    
                                    const optA = calculateOptimalCombination(clinic, doseA, 1);
                                    const optB = calculateOptimalCombination(clinic, doseB, 1);
                                    
                                    if (optA && optB) {
                                        const indivTotal = (optA.cost + optB.cost) * pairs;
                                        const bundleTotal = twoMonthCombo.price * pairs;
                                        
                                        if (bundleTotal < indivTotal) {
                                            totalMeds += bundleTotal;
                                            breakdown.push(`${label} x ${pairs}`);
                                            bundleApplied = true;
                                            tempCart[doseA] -= pairs;
                                            tempCart[doseB] -= pairs;
                                        }
                                    }
                                }
                            }
                        }
                    });

                    Object.entries(tempCart).forEach(([dosage, months]) => {
                        if (months > 0) {
                            const optimal = calculateOptimalCombination(clinic, dosage, months);
                            if (optimal) {
                                totalMeds += optimal.cost;
                                
                                const counts = {};
                                optimal.plans.forEach(p => {
                                    counts[p.months] = (counts[p.months] || 0) + 1;
                                });
                                const parts = Object.keys(counts).sort((a,b) => parseFloat(b) - parseFloat(a)).map(m => {
                                    const c = counts[m];
                                    let label = getLabel(parseFloat(m));
                                    const plan = optimal.plans.find(p => p.months === parseFloat(m));
                                    if (plan && plan.type === 'initial') label += ` (${t.firstTime})`;
                                    return c > 1 ? `${label} x${c}` : label;
                                });
                                
                                breakdown.push(`${dosage} [${parts.join(' + ')}]`);
                            } else {
                                possible = false;
                            }
                        }
                    });

                    if (possible) {
                        // Calculate total with offline discount logic AND online fee logic
                        const isOffline = region !== 'all' && clinic.locations && clinic.locations.includes(region);
                        
                        let total = totalMeds + getRegFee(clinic) + getShippingFee(clinic, region, totalSelectedMonths);
                        
                        if (isOffline && clinic.offlineDiscount) {
                            total -= clinic.offlineDiscount;
                        }
                        
                        if ((region === 'all' || !isOffline) && clinic.onlineFee) {
                            total += clinic.onlineFee;
                        }

                        results.push({
                            clinic: clinic,
                            meds: totalMeds,
                            total: total,
                            breakdown: breakdown.join(', '),
                            isBundle: bundleApplied
                        });
                    }
                });

                return results.sort((a, b) => a.total - b.total);
            };

            const calcResults = getCalculatorResults();

            return (
                <div className="max-w-5xl mx-auto px-6 py-10 md:py-16">
                    {/* Disclaimer Modal */}
                    {showDisclaimerModal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => {}}></div>
                            <div className="relative bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 md:p-8 animate-fade-up">
                                <h2 className="text-xl font-serif font-bold text-stone-900 mb-4 flex items-center gap-2">
                                    <Icons.Alert className="text-gold-500" /> 
                                    {lang === 'zh' ? '重要須知：海外帶藥與處方' : 'Important Notice'}
                                </h2>
                                <div className="space-y-4 text-sm text-stone-600 font-sans leading-relaxed">
                                    <p>
                                        {lang === 'zh' 
                                            ? '1. 關於海外攜帶藥物回國（如台灣），請務必自行確認海關「自用藥物限量」規範。'
                                            : '1. Please verify your country's customs regulations regarding bringing personal medication from overseas.'}
                                        <a href="https://web.customs.gov.tw/taipei/singlehtml/3392?cntId=cus2_3392_3392_1347" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-0.5 text-gold-600 hover:text-gold-700 ml-1 font-bold underline decoration-gold-300 underline-offset-2">
                                            {t.customsLink}
                                        </a>
                                    </p>
                                    <p className="font-bold text-stone-800 bg-stone-50 p-3 rounded-lg border border-stone-200">
                                        {lang === 'zh'
                                            ? '2. 請注意：由於使用猛健樂做減肥療程在日本屬於適用症外應用,大部分診所（包含本站列出者）「不提供」處方籤或診斷證明書。'
                                            : '2. Important: Since Mounjaro is considered an off-label treatment for obesity in Japan, most Japanese clinics will not issue formal prescriptions or medical certificates for this purpose.'}
                                    </p>
                                    <p>
                                        {lang === 'zh'
                                            ? '3. 本網站僅供價格比較，不負擔任何法律責任。'
                                            : '3. This site is for price comparison only and assumes no legal liability.'}
                                    </p>
                                </div>
                                <div className="mt-6 flex items-center gap-2">
                                    <input 
                                        type="checkbox" 
                                        id="dontShowToday" 
                                        checked={dontShowToday} 
                                        onChange={(e) => setDontShowToday(e.target.checked)}
                                        className="w-4 h-4 text-gold-500 rounded border-stone-300 focus:ring-gold-500"
                                    />
                                    <label htmlFor="dontShowToday" className="text-sm text-stone-500 cursor-pointer select-none">
                                        {lang === 'zh' ? '今日不再顯示' : "Don't show again today"}
                                    </label>
                                </div>
                                <button 
                                    onClick={handleCloseModal}
                                    className="w-full mt-4 bg-stone-900 text-white py-3 rounded-lg font-bold hover:bg-stone-800 transition-colors"
                                >
                                    {lang === 'zh' ? '我已了解並繼續' : 'I Understand'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Filter Drawer (Mobile) */}
                    {showMobileFilters && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setShowMobileFilters(false)}></div>
                            <div className="relative z-50 w-4/5 max-w-sm h-full bg-[#FAFAF9] shadow-2xl p-6 overflow-y-auto animate-fade-up">
                                <div className="flex justify-between items-center mb-6 border-b border-stone-200 pb-4">
                                    <h3 className="font-serif text-xl text-stone-900">{t.filterLabel}</h3>
                                    <button onClick={() => setShowMobileFilters(false)} className="text-stone-500 hover:text-stone-900">
                                        <Icons.X size={24}/>
                                    </button>
                                </div>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">{t.userTypeLabel}</label>
                                        <div className="custom-select-wrapper">
                                            <select className="custom-select" value={userType} onChange={(e) => setUserType(e.target.value)}>
                                                <option value="new">{t.userNew}</option>
                                                <option value="returning">{t.userReturning}</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">{t.filterLabel}</label>
                                        <div className="custom-select-wrapper">
                                            <select className="custom-select" value={chineseFilter ? 'chinese' : 'all'} onChange={(e) => setChineseFilter(e.target.value === 'chinese')}>
                                                <option value="all">{t.filterAll}</option>
                                                <option value="chinese">{t.filterChinese}</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">{t.regionLabel}</label>
                                        <div className="custom-select-wrapper">
                                            <select className="custom-select bg-gold-100/30 border-gold-200 text-stone-700" value={region} onChange={(e) => setRegion(e.target.value)}>
                                                {REGIONS.map(r => (
                                                    <option key={r.id} value={r.id}>{lang === 'zh' ? r.zh : r.en}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    {mode === 'standard' && (
                                        <>
                                            <div>
                                                <label className="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">{t.dosageLabel}</label>
                                                <div className="custom-select-wrapper">
                                                    <select className="custom-select" value={activeDosage} onChange={(e) => setActiveDosage(e.target.value)}>
                                                        <optgroup label={t.dosageLabel}>
                                                            {['2.5mg', '5mg', '7.5mg', '10mg', '12.5mg', '15mg'].map(d => (
                                                                <option key={d} value={d}>{d}</option>
                                                            ))}
                                                        </optgroup>
                                                        <optgroup label={t.transitPlan}>
                                                            {['2.5mg+5mg', '5mg+7.5mg', '7.5mg+10mg', '10mg+12.5mg', '12.5mg+15mg'].map(combo => (
                                                                <option key={combo} value={combo}>{combo === '2.5mg+5mg' ? t.combo2550 : combo === '5mg+7.5mg' ? t.combo5075 : combo === '7.5mg+10mg' ? t.combo75100 : combo === '10mg+12.5mg' ? t.combo100125 : t.combo125150}</option>
                                                            ))}
                                                        </optgroup>
                                                    </select>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">{t.durationLabel}</label>
                                                <div className="custom-select-wrapper">
                                                    <select className="custom-select" value={activeDuration} onChange={(e) => setActiveDuration(e.target.value === 'all' ? 'all' : parseFloat(e.target.value))}>
                                                        <option value="all">{t.allPlans}</option>
                                                        <option value="0.5">0.5 {t.month}</option>
                                                        <option value="1">1 {t.month}</option>
                                                        <option value="2">2 {t.months}</option>
                                                        <option value="3">3 {t.months}</option>
                                                        <option value="6">6 {t.months}</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                    <button onClick={() => setShowMobileFilters(false)} className="w-full bg-stone-900 text-white py-3 rounded-lg font-sans font-bold mt-4 shadow-lg active:scale-95 transition-transform">{t.applyFilter}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header & Main Controls */}
                    <div className="flex flex-col-reverse md:flex-row justify-between items-center mb-8 gap-6 relative z-40">
                        {/* Mode Switcher (Left) */}
                        <div className="flex gap-2">
                            <button onClick={() => setMode('standard')} className={`flex items-center justify-center gap-2 px-6 py-2 rounded-full text-sm font-sans transition-all shadow-sm ${mode === 'standard' ? 'bg-stone-900 text-white' : 'bg-white border border-stone-200 text-stone-500 hover:bg-stone-50'}`}>
                                <Icons.Grid /> {t.modeStandard}
                            </button>
                            <button onClick={() => setMode('calculator')} className={`flex items-center justify-center gap-2 px-6 py-2 rounded-full text-sm font-sans transition-all shadow-sm ${mode === 'calculator' ? 'bg-gold-500 text-white' : 'bg-white border border-stone-200 text-stone-500 hover:bg-stone-50'}`}>
                                <Icons.Calc /> {t.modeCalculator}
                            </button>
                        </div>

                        {/* Language Switcher (Right) */}
                        <div className="flex gap-4 items-center">
                            <button onClick={() => setLang('zh')} className={`lang-btn ${lang === 'zh' ? 'active' : ''}`}>中文</button>
                            <button onClick={() => setLang('en')} className={`lang-btn ${lang === 'en' ? 'active' : ''}`}>EN</button>
                        </div>
                    </div>

                    <header className="text-center mb-10">
                        <h1 className="font-display text-2xl md:text-3xl tracking-widest text-stone-900 uppercase mb-2">Mounjaro</h1>
                        <p className="font-serif text-xs text-stone-500 italic mb-4">{t.subtitle}</p>
                        <a href="https://web.customs.gov.tw/taipei/singlehtml/3392?cntId=cus2_3392_3392_1347" target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-1.5 text-[11px] text-gold-700 bg-gold-50 border border-gold-200 px-3 py-1.5 rounded-full hover:bg-gold-100 transition-colors font-sans font-bold shadow-sm">
                            <Icons.Info size={12}/> {t.customsLink} <Icons.ExternalLink size={10}/>
                        </a>
                    </header>

                    {/* Standard Mode - Sticky Bar */}
                    {mode === 'standard' && (
                        <div className="mb-12 sticky top-0 z-30 bg-[#FAFAF9]/95 backdrop-blur-sm py-4 border-b border-stone-200 transition-all shadow-sm max-w-5xl mx-auto">
                            {/* Desktop Filter View */}
                            <div className="hidden md:grid grid-cols-5 gap-4 px-1">
                                <div className="custom-select-wrapper">
                                    <select 
                                        className="custom-select" 
                                        value={userType} 
                                        onChange={(e) => setUserType(e.target.value)}
                                    >
                                        <option value="new">{t.userNew}</option>
                                        <option value="returning">{t.userReturning}</option>
                                    </select>
                                </div>
                                <div className="custom-select-wrapper">
                                    <select 
                                        className="custom-select" 
                                        value={chineseFilter ? 'chinese' : 'all'} 
                                        onChange={(e) => setChineseFilter(e.target.value === 'chinese')}
                                    >
                                        <option value="all">{t.filterAll}</option>
                                        <option value="chinese">{t.filterChinese}</option>
                                    </select>
                                </div>
                                <div className="custom-select-wrapper">
                                    <select 
                                        className="custom-select bg-gold-100/30 border-gold-200 text-stone-700" 
                                        value={region} 
                                        onChange={(e) => setRegion(e.target.value)}
                                    >
                                        {REGIONS.map(r => (
                                            <option key={r.id} value={r.id}>{lang === 'zh' ? r.zh : r.en}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="custom-select-wrapper">
                                    <select 
                                        className="custom-select" 
                                        value={activeDosage} 
                                        onChange={(e) => setActiveDosage(e.target.value)}
                                    >
                                        <optgroup label={t.dosageLabel}>
                                            {['2.5mg', '5mg', '7.5mg', '10mg', '12.5mg', '15mg'].map(d => (
                                                <option key={d} value={d}>{d}</option>
                                            ))}
                                        </optgroup>
                                        <optgroup label={t.transitPlan}>
                                            {['2.5mg+5mg', '5mg+7.5mg', '7.5mg+10mg', '10mg+12.5mg', '12.5mg+15mg'].map(combo => (
                                                <option key={combo} value={combo}>
                                                    {combo === '2.5mg+5mg' ? t.combo2550 : combo === '5mg+7.5mg' ? t.combo5075 : combo === '7.5mg+10mg' ? t.combo75100 : combo === '10mg+12.5mg' ? t.combo100125 : t.combo125150}
                                                </option>
                                            ))}
                                        </optgroup>
                                    </select>
                                </div>
                                <div className="custom-select-wrapper">
                                    <select 
                                        className="custom-select" 
                                        value={activeDuration} 
                                        onChange={(e) => setActiveDuration(e.target.value === 'all' ? 'all' : parseFloat(e.target.value))}
                                    >
                                        <option value="all">{t.allPlans}</option>
                                        <option value="0.5">0.5 {t.month}</option>
                                        <option value="1">1 {t.month}</option>
                                        <option value="2">2 {t.months}</option>
                                        <option value="3">3 {t.months}</option>
                                        <option value="6">6 {t.months}</option>
                                    </select>
                                </div>
                            </div>

                            {/* Mobile Filter Trigger View */}
                            <div className="flex md:hidden items-center justify-between gap-3 px-1">
                                <div className="flex-1 flex flex-col justify-center">
                                     <span className="text-[10px] uppercase text-stone-400 tracking-wider font-bold">{t.dosage} / {t.durationLabel}</span>
                                     <span className="font-serif text-stone-800 text-lg leading-tight truncate">
                                        {activeDosage.replace('+',' & ')} • {activeDuration === 'all' ? t.allPlans : getLabel(activeDuration)}
                                     </span>
                                </div>
                                <button 
                                    onClick={() => setShowMobileFilters(true)} 
                                    className="flex items-center gap-2 bg-white border border-stone-300 text-stone-700 px-4 py-2 rounded-lg shadow-sm font-sans font-bold text-sm active:bg-stone-50"
                                >
                                    <Icons.Filter size={16}/> {t.mobileFilterBtn}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Calculator Mode - Controls */}
                    {mode === 'calculator' && (
                        <div className="mb-8 max-w-5xl mx-auto">
                            {/* Desktop Calc Controls */}
                            <div className="hidden md:flex flex-row gap-4 justify-start bg-white p-3 rounded-lg border border-stone-100 shadow-sm">
                                <div className="custom-select-wrapper w-auto">
                                    <select className="custom-select" value={userType} onChange={(e) => setUserType(e.target.value)}>
                                        <option value="new">{t.userNew}</option>
                                        <option value="returning">{t.userReturning}</option>
                                    </select>
                                </div>
                                <div className="custom-select-wrapper w-auto">
                                    <select className="custom-select" value={chineseFilter ? 'chinese' : 'all'} onChange={(e) => setChineseFilter(e.target.value === 'chinese')}>
                                        <option value="all">{t.filterAll}</option>
                                        <option value="chinese">{t.filterChinese}</option>
                                    </select>
                                </div>
                                <div className="custom-select-wrapper w-auto">
                                    <select className="custom-select bg-gold-100/30 border-gold-200 text-stone-700" value={region} onChange={(e) => setRegion(e.target.value)}>
                                        {REGIONS.map(r => (<option key={r.id} value={r.id}>{lang === 'zh' ? r.zh : r.en}</option>))}
                                    </select>
                                </div>
                            </div>
                             {/* Mobile Calc Controls Trigger */}
                             <div className="md:hidden flex justify-end mb-4">
                                <button 
                                    onClick={() => setShowMobileFilters(true)} 
                                    className="flex items-center gap-2 bg-white border border-stone-300 text-stone-700 px-4 py-2 rounded-lg shadow-sm font-sans font-bold text-sm w-full justify-center"
                                >
                                    <Icons.Filter size={16}/> {t.mobileFilterBtn}
                                </button>
                             </div>
                        </div>
                    )}

                    {/* Content - Calculator */}
                    {mode === 'calculator' && (
                        <div className="animate-fade-up">
                            <div className="bg-white border border-gold-200 rounded-xl p-6 md:p-8 shadow-sm mb-12">
                                <div className="flex flex-col md:flex-row md:justify-between md:items-start mb-8 gap-6">
                                    <div className="order-1">
                                        <h3 className="font-serif text-xl text-stone-800 mb-2 flex items-center gap-2">
                                            <Icons.Calc /> {t.modeCalculator}
                                        </h3>
                                        <div className="md:hidden mt-4 mb-4">
                                            <div className={`text-sm font-bold flex items-center justify-between gap-2 ${totalSelectedMonths >= 6 ? 'text-red-500' : 'text-stone-600'}`}>
                                                <span className="text-xs uppercase text-stone-400 tracking-wider">{t.totalSelected}</span>
                                                <span>{totalSelectedMonths} / 6</span>
                                            </div>
                                            <div className="w-full h-2 bg-stone-100 rounded-full mt-2 overflow-hidden">
                                                <div className={`h-full transition-all duration-500 ${totalSelectedMonths >= 6 ? 'bg-red-400' : 'bg-gold-400'}`} style={{width: `${Math.min(totalSelectedMonths/6 * 100, 100)}%`}}></div>
                                            </div>
                                            {totalSelectedMonths >= 6 && <div className="text-right text-[10px] text-red-400 mt-1 font-sans flex items-center justify-end gap-1"><Icons.Alert size={10}/> {t.maxLimitMsg}</div>}
                                        </div>
                                        <p className="text-stone-500 text-sm font-sans leading-relaxed">{t.calcIntro}</p>
                                        {userType === 'new' && <p className="text-gold-600 text-xs mt-2 font-bold bg-gold-50 p-2 rounded border border-gold-100 inline-block">{t.calcDisclaimer}</p>}
                                    </div>
                                    <div className="hidden md:flex flex-col items-end order-2">
                                        <div className={`text-sm font-bold flex items-center gap-2 ${totalSelectedMonths >= 6 ? 'text-red-500' : 'text-stone-600'}`}>
                                            {totalSelectedMonths >= 6 && <Icons.Alert size={16}/>}
                                            {t.totalSelected}: {totalSelectedMonths} / 6
                                        </div>
                                        {totalSelectedMonths >= 6 && <span className="text-[10px] text-red-400 mt-1 font-sans">{t.maxLimitMsg}</span>}
                                        <div className="w-48 h-2 bg-stone-100 rounded-full mt-2 overflow-hidden">
                                            <div className={`h-full transition-all duration-500 ${totalSelectedMonths >= 6 ? 'bg-red-400' : 'bg-gold-400'}`} style={{width: `${Math.min(totalSelectedMonths/6 * 100, 100)}%`}}></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
                                    {Object.keys(cart).map(dosage => (
                                        <div key={dosage} className="flex flex-col">
                                            <label className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">{dosage}</label>
                                            <div className={`flex items-center border rounded-lg overflow-hidden transition-colors h-12 ${totalSelectedMonths >= 6 && cart[dosage] === 0 ? 'bg-stone-50 border-stone-100 opacity-50 cursor-not-allowed' : 'bg-stone-50 border-stone-200'}`}>
                                                <input type="number" min="0" max="6" value={cart[dosage]} onChange={(e) => {
                                                        let val = parseInt(e.target.value) || 0;
                                                        if (val < 0) val = 0;
                                                        const currentTotal = Object.entries(cart).filter(([key]) => key !== dosage).reduce((sum, [, v]) => sum + v, 0);
                                                        if (currentTotal + val > 6) val = 6 - currentTotal;
                                                        setCart({...cart, [dosage]: val});
                                                    }}
                                                    className="w-full p-2 text-center text-stone-900 font-sans font-bold bg-transparent outline-none text-lg"
                                                />
                                                <span className="pr-3 text-xs text-stone-400 select-none whitespace-nowrap">{t.monthsCount}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex justify-end border-t border-stone-100 pt-4">
                                    <button onClick={() => setCart({'2.5mg': 0, '5mg': 0, '7.5mg': 0, '10mg': 0, '12.5mg': 0, '15mg': 0})} className="text-xs text-stone-400 hover:text-red-500 font-sans border-b border-transparent hover:border-red-500 transition-all">{t.reset}</button>
                                </div>
                            </div>
                            <div className="grid gap-6">
                                {calcResults.map((res, idx) => {
                                    const shippingCost = getShippingFee(res.clinic, region, totalSelectedMonths);
                                    const isOffline = shippingCost === 0 && res.clinic.locations && res.clinic.locations.includes(region);
                                    const offlineDiscount = (isOffline && res.clinic.offlineDiscount) ? res.clinic.offlineDiscount : 0;
                                    const onlineFee = ((region === 'all' || !isOffline) && res.clinic.onlineFee) ? res.clinic.onlineFee : 0;
                                    
                                    return (
                                        <div key={res.clinic.id} className="bg-white border border-stone-100 rounded-lg p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden group hover:shadow-md transition-all">
                                            {idx === 0 && <div className="absolute top-0 left-0 w-1 h-full bg-gold-400"></div>}
                                            {/* Location Badge for Calc Mode */}
                                            <div className="absolute top-0 right-0 bg-stone-100 text-stone-500 text-[10px] font-bold px-2 py-1 rounded-bl-lg z-10 border-b border-l border-stone-200">
                                                {getLocationName(res.clinic)}
                                            </div>
                                            <div className="flex-1 w-full pt-4 md:pt-0">
                                                <div className="flex items-center justify-between md:justify-start gap-3 mb-2">
                                                    <h3 className="font-serif text-xl text-stone-900">{res.clinic.name[lang]}</h3>
                                                    {idx === 0 && <span className="bg-gold-400 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider shrink-0">{t.bestValue}</span>}
                                                    {res.isBundle && <span className="bg-stone-900 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider shrink-0 flex items-center gap-1"><Icons.Star size={10}/> {t.bundleApplied}</span>}
                                                </div>
                                                <p className="text-sm text-stone-500 font-sans mb-3 flex items-center gap-2"><span className="bg-stone-100 px-2 py-1 rounded text-xs break-all">{res.breakdown}</span></p>
                                                <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-stone-400 font-sans">
                                                    <span>{t.meds}: {formatCurrency(res.meds)}</span>
                                                    {getRegFee(res.clinic) > 0 && <span>+ {t.regFee}: {formatCurrency(getRegFee(res.clinic))}</span>}
                                                    {shippingCost > 0 ? (
                                                        <span>+ {t.shipFee}: {formatCurrency(shippingCost)}</span>
                                                    ) : (
                                                        (isOffline && !res.clinic.offlineOnly) && <span className="text-gold-600 font-bold flex items-center gap-1"><Icons.MapPin size={10}/> {t.shippingOffline}</span>
                                                    )}
                                                    {offlineDiscount > 0 && <span className="text-green-600 font-bold"> - {formatCurrency(offlineDiscount)} (Off)</span>}
                                                    {onlineFee > 0 && <span className="text-red-500 font-bold"> + {t.onlineFee}: {formatCurrency(onlineFee)}</span>}
                                                </div>
                                            </div>
                                            <div className="text-right w-full md:w-auto border-t md:border-t-0 border-stone-100 pt-3 md:pt-0 mt-2 md:mt-0">
                                                <span className="text-xs text-stone-400 uppercase block mb-1">{t.calcTotal}</span>
                                                <span className={`text-3xl font-sans font-light tracking-tight ${idx === 0 ? 'text-stone-900' : 'text-stone-600'}`}>
                                                    {formatCurrency(res.total)}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                                {calcResults.length === 0 && (
                                    <div className="text-center py-12 text-stone-400 font-serif italic bg-white rounded-xl border border-dashed border-stone-200">{t.noData}</div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Content - Standard */}
                    {mode === 'standard' && (
                        <div className="animate-fade-up">
                            <div className="flex flex-col items-center mb-12 gap-2">
                                <div className="bg-white border border-stone-200 px-6 py-3 flex items-center gap-3 shadow-sm rounded-full">
                                    <div className="text-stone-400"><Icons.Info /></div>
                                    <p className="text-xs text-stone-500 uppercase tracking-wider font-sans">{t.disclaimer} <span className="text-stone-900 font-bold border-b border-stone-300">{t.disclaimerHighlight}</span>.</p>
                                </div>
                                <div className="flex items-center gap-1 text-xs text-stone-400 font-sans tracking-wide animate-pulse"><Icons.Sort size={12} /> {t.sortNote}</div>
                            </div>
                            {sortedClinics.length === 0 && (
                                <div className="text-center py-20 animate-fade-up">
                                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-stone-100 text-stone-400 mb-4"><Icons.Info size={24} /></div>
                                    <p className="text-stone-500 font-serif italic max-w-md mx-auto">{t.noData}</p>
                                </div>
                            )}
                            <div className="grid gap-8 md:gap-10">
                                {sortedClinics.map((clinic, clinicIndex) => {
                                    const displayPrices = getSmartPrices(clinic, activeDosage, activeDuration);
                                    let rankColor = '';
                                    if (clinicIndex === 0) rankColor = 'bg-gold-400 text-white';
                                    else if (clinicIndex === 1) rankColor = 'bg-stone-400 text-white';
                                    else if (clinicIndex === 2) rankColor = 'bg-stone-300 text-white';
                                    
                                    return (
                                        <div key={clinic.id} className="group animate-fade-up bg-white shadow-sm border border-stone-100 hover:shadow-md transition-all duration-500 relative">
                                            {/* Rank Badge */}
                                            {rankColor && <div className={`absolute -top-3 -left-3 ${rankColor} w-8 h-8 flex items-center justify-center font-display font-bold shadow-md z-10 rank-badge rounded-sm`}>{clinicIndex + 1}</div>}
                                            
                                            {/* Location Badge (Top Right) */}
                                            <div className="absolute top-0 right-0 bg-stone-100 text-stone-500 text-[10px] font-bold px-2 py-1 rounded-bl-lg z-10 border-b border-l border-stone-200">
                                                {getLocationName(clinic)}
                                            </div>

                                            <div className="flex flex-col md:flex-row md:items-center justify-between p-6 md:p-8 border-b border-stone-100 pt-8 md:pt-8">
                                                <div>
                                                    <div className="flex items-baseline gap-3 mb-2">
                                                        <h2 className="font-serif text-xl md:text-2xl text-stone-900">{clinic.name[lang]}</h2>
                                                        <a href={clinic.link} target="_blank" className="text-stone-300 hover:text-gold-400 transition-colors"><Icons.ExternalLink /></a>
                                                    </div>
                                                    <div className="flex flex-wrap gap-2">
                                                        {(() => {
                                                            if (clinic.freeShipping) {
                                                                return <span className="text-[10px] uppercase tracking-widest border border-stone-200 text-stone-600 px-2 py-1 flex items-center gap-1 font-sans bg-stone-50/50"><Icons.Truck size={10}/> {t.shippingIncluded}</span>;
                                                            } else if (clinic.offlineOnly) {
                                                                 return <span className="text-[10px] uppercase tracking-widest border border-gold-200 text-gold-600 bg-gold-50 px-2 py-1 flex items-center gap-1 font-sans font-bold"><Icons.MapPin size={10}/> {t.visitOnly}</span>;
                                                            } else if (region !== 'all' && clinic.locations && clinic.locations.includes(region)) {
                                                                 return <span className="text-[10px] uppercase tracking-widest border border-gold-200 text-gold-600 bg-gold-50 px-2 py-1 flex items-center gap-1 font-sans font-bold"><Icons.MapPin size={10}/> {t.shippingOffline}</span>;
                                                            } else {
                                                                return <span className="text-[10px] uppercase tracking-widest border border-stone-200 text-stone-400 px-2 py-1 flex items-center gap-1 font-sans"><Icons.Truck size={10}/> {t.shippingExtra}</span>;
                                                            }
                                                        })()}
                                                        <span className="text-[10px] uppercase tracking-widest border border-stone-200 text-stone-400 px-2 py-1 font-sans">{t.regFeeLabel}: {formatCurrency(getRegFee(clinic))}</span>
                                                        {clinic.tags.map((tagObj, idx) => <span key={idx} className="text-[10px] uppercase tracking-widest bg-stone-50 text-stone-400 px-2 py-1 font-sans">{tagObj[lang]}</span>)}
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {displayPrices.map((item, idx) => {
                                                    let isBestPrice = false;
                                                    const monthlyAvg = item.totalPrice / item.months;
                                                    if (activeDuration === 'all') isBestPrice = Math.abs(monthlyAvg - bestPrice) < 10;
                                                    else isBestPrice = Math.abs(item.totalPrice - bestPrice) < 10;

                                                    const shippingCost = getShippingFee(clinic, region, item.months);
                                                    const isOffline = shippingCost === 0 && clinic.locations && clinic.locations.includes(region);
                                                    const offlineDiscount = (isOffline && clinic.offlineDiscount) ? clinic.offlineDiscount : 0;
                                                    const onlineFee = ((region === 'all' || !isOffline) && clinic.onlineFee) ? clinic.onlineFee : 0;

                                                    return (
                                                        <div key={idx} className={`relative p-6 transition-all duration-300 flex flex-col justify-between rounded-sm ${isBestPrice ? 'bg-stone-50 border border-gold-200' : 'bg-white border border-stone-100 opacity-80 hover:opacity-100 hover:border-stone-300'}`}>
                                                            {isBestPrice && <div className="absolute top-0 right-0 bg-gold-400 text-white text-[10px] font-bold uppercase tracking-widest px-3 py-1 font-sans rounded-bl-sm">{t.bestValue}</div>}
                                                            <div className="mb-6">
                                                                <div className="flex justify-between items-start mb-2">
                                                                    <span className="font-serif italic text-stone-600 text-lg">{item.label}</span>
                                                                    <div className="flex flex-col items-end gap-1">
                                                                        {item.isCalculated && <span className="text-[10px] uppercase text-stone-300 border border-stone-200 px-1 font-sans">{t.est}</span>}
                                                                        {item.months === 0.5 && <span className="text-[10px] text-red-400 border border-red-200 bg-red-50 px-1 font-sans">{t.firstTime}</span>}
                                                                        {item.type === 'initial' && <span className="text-[10px] text-gold-600 border border-gold-200 bg-gold-50 px-1 font-sans">{t.firstTime}</span>}
                                                                    </div>
                                                                </div>
                                                                <div className="flex items-baseline gap-1">
                                                                    <span className={`text-3xl font-light tracking-tight font-sans ${isBestPrice ? 'text-stone-900' : 'text-stone-600'}`}>{formatCurrency(item.totalPrice)}</span>
                                                                    <span className="text-xs text-stone-400 uppercase font-sans">{t.total}</span>
                                                                </div>
                                                                <div className="mt-2 pt-2 border-t border-stone-100 text-[10px] text-stone-400 flex flex-col gap-0.5 font-sans">
                                                                    <div className="flex justify-between"><span>{t.meds}</span><span>{formatCurrency(item.drugPriceOnly)}</span></div>
                                                                    {getRegFee(clinic) > 0 && <div className="flex justify-between"><span>{t.regFee}</span><span>+ {formatCurrency(getRegFee(clinic))}</span></div>}
                                                                    {shippingCost > 0 ? (
                                                                        <div className="flex justify-between"><span>{t.shipFee}</span><span>+ {formatCurrency(shippingCost)}</span></div>
                                                                    ) : (
                                                                        (isOffline && !clinic.offlineOnly) && (
                                                                            <div className="flex flex-col items-end mt-1">
                                                                                <div className="flex justify-end text-gold-600 font-bold"><Icons.MapPin size={10} className="mr-1"/>{t.shippingOffline}</div>
                                                                                {offlineDiscount > 0 && <div className="text-[10px] text-green-600 font-bold">(-{formatCurrency(offlineDiscount)})</div>}
                                                                            </div>
                                                                        )
                                                                    )}
                                                                    {onlineFee > 0 && <div className="flex justify-between text-red-500 font-bold"><span>{t.onlineFee}</span><span>+ {formatCurrency(onlineFee)}</span></div>}
                                                                </div>
                                                            </div>
                                                            <div className="flex items-end justify-between">
                                                                {item.months !== 1 && activeDuration === 'all' ? (
                                                                    <div className="text-right w-full">
                                                                        <p className="text-[10px] uppercase text-stone-400 tracking-widest mb-1 font-sans">{t.monthlyAvg}</p>
                                                                        <p className={`font-sans font-bold ${isBestPrice ? 'text-gold-600' : 'text-stone-500'}`}>{formatCurrency(monthlyAvg)}</p>
                                                                    </div>
                                                                ) : (
                                                                    <div className="w-full">
                                                                        {item.isCalculated && <p className="text-[10px] text-stone-400 italic text-right font-serif">* {item.calculationNote}</p>}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <footer className="mt-20 pt-10 border-t border-stone-200 text-center text-stone-400">
                        <p className="font-serif italic text-sm mb-2">{t.footerNote} {rateDate && `(${t.rateDateLabel}: ${rateDate})`}</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MounjaroBoutique />);
    </script>
</body>
</html>
